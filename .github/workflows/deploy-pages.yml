name: Deploy PWA to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Restore Android release signing key
        env:
          SUJIAN_ANDROID_KEYSTORE_BASE64: ${{ secrets.SUJIAN_ANDROID_KEYSTORE_BASE64 }}
          SUJIAN_ANDROID_STORE_PASSWORD: ${{ secrets.SUJIAN_ANDROID_STORE_PASSWORD }}
          SUJIAN_ANDROID_KEY_ALIAS: ${{ secrets.SUJIAN_ANDROID_KEY_ALIAS }}
          SUJIAN_ANDROID_KEY_PASSWORD: ${{ secrets.SUJIAN_ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s' "$SUJIAN_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/suijian-release.jks"
          echo "SUJIAN_ANDROID_KEYSTORE=$RUNNER_TEMP/suijian-release.jks" >> "$GITHUB_ENV"
          echo "SUJIAN_ANDROID_STORE_PASSWORD=$SUJIAN_ANDROID_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "SUJIAN_ANDROID_KEY_ALIAS=$SUJIAN_ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "SUJIAN_ANDROID_KEY_PASSWORD=$SUJIAN_ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Validate source
        run: npm test
      - name: Build signed Android installer and static PWA
        run: npm run build:android
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-mobile

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
